[build]
  command   = "npm run build"
  publish   = "dist"

# Redirect all routes to index.html for React Router (SPA fallback)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Optional: security & performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
